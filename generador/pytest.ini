# Nombre: pytest.ini
# Descripción: Configuración de las pruebas del generador (pytest).
# Fecha de creación: 13/10/2026
# Actualización: 13/10/2026
# Autor: Equipo InspectIA
# Versión: 1.0

[pytest]
testpaths = pruebas
pythonpath = .
addopts = --strict-markers
markers =
    caso(texto): ficha o requisito que cubre la prueba, como «RF-02 · C4 · ...» o «RP-23 · ...» (RP-13)
