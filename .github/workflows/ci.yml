# Nombre: ci.yml
# Descripción: Integración y despliegue continuos de InspectIA (RP-18, RP-19, D-16). En cada PR hacia main, en cada
#              push a main y a mano, compila y prueba el generador, el backend, el frontend y la infraestructura,
#              construye las imágenes Docker arm64 del backend y del servicio de IA, y corre las pruebas de punta a
#              punta (Playwright y Selenium) en el entorno aislado; Selenium, sin Edge, que se prueba en Windows. En
#              main, con las variables de AWS del repositorio, sube las imágenes a ECR y, si todo pasa, despliega:
#              actualiza la instancia por SSM, publica la página en S3 e invalida CloudFront. Si un job falla en
#              main, abre un issue asignado a quien hizo el push, o comenta en el que ya está abierto por esa falla;
#              cuando el job vuelve a pasar en main, lo cierra. Stryker no corre aquí: tarda mucho y se corre a mano.
# Fecha de creación: 04/11/2026
# Actualización: 24/11/2026
# Autor: Equipo InspectIA
# Versión: 1.1

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la rama de un PR cancela la corrida anterior de ese PR, que ya no sirve. En main cada corrida tiene
# su propio grupo: ninguna se cancela ni espera a otra, así se prueba cada push.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generador:
    name: Generador
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: generador/requirements*.txt
      - name: Dependencias
        run: python -m pip install -r generador/requirements-dev.txt
      - name: Pruebas
        working-directory: generador
        run: python -m pytest
      - name: Lo generado está al día
        run: python generador/generar.py comprobar
      - name: docs/casos-de-prueba.md está al día
        run: python generador/casos_de_prueba.py comprobar

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Las de integración usan PostgreSQL 18 en Testcontainers, con el Docker que trae el runner.
      - name: Pruebas unitarias y de integración
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Reportes de las pruebas, si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  infra:
    name: Infraestructura
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
      # Sin red y sin construir imágenes: scripts, JSON de AWS, compose de producción, CloudFront Function e IAM.
      - name: Pruebas de la infraestructura
        run: bash infra/probar.sh

  imagenes:
    name: Imágenes Docker (${{ matrix.servicio }})
    # Runners arm64, como la EC2 t4g (Graviton): la imagen se construye nativa, sin emular. Son gratis en
    # repositorios públicos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        servicio: [backend, ia-servicio]
    env:
      # En main, con las variables de AWS, las imágenes se suben a ECR con la etiqueta del commit; en un PR solo se
      # construyen. Subirlas no despliega nada: eso lo hace el job «despliegue», cuando todos los demás pasan.
      PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_CUENTA != '' && vars.AWS_ROL_GITHUB != '' }}
      IMAGEN: ${{ vars.AWS_CUENTA || '000000000000' }}.dkr.ecr.us-east-1.amazonaws.com/inspectia/${{ matrix.servicio }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      # El Dockerfile del servicio de IA llega con su propio PR: mientras no esté, ese lado de la matriz se salta.
      - name: ¿Tiene Dockerfile?
        id: dockerfile
        env:
          SERVICIO: ${{ matrix.servicio }}
        run: |
          if [ -f "$SERVICIO/Dockerfile" ]; then
            echo 'existe=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SERVICIO/Dockerfile no existe todavía: su imagen no se construye."
            echo 'existe=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.dockerfile.outputs.existe == 'true'
      - name: Credenciales de AWS (OIDC, sin claves)
        if: steps.dockerfile.outputs.existe == 'true' && env.PUBLICAR == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROL_GITHUB }}
          aws-region: us-east-1
      - name: Sesión en ECR
        if: steps.dockerfile.outputs.existe == 'true' && env.PUBLICAR == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Construir para arm64 (y subir a ECR en main)
        if: steps.dockerfile.outputs.existe == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.servicio }}
          platforms: linux/arm64
          push: ${{ env.PUBLICAR == 'true' }}
          provenance: false
          tags: ${{ env.IMAGEN }}
          cache-from: type=gha,scope=${{ matrix.servicio }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}-arm64

  punta-a-punta:
    name: De punta a punta
    # Empieza solo si los otros pasan: así no se gastan sus minutos cuando ya falló algo más barato.
    needs: [generador, backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      # Sin caché: Playwright recomienda descargarlos, porque restaurarlos tarda casi lo mismo, y sus dependencias de
      # Linux se instalan igual. Chrome, para Selenium, ya viene en el runner.
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      # Un solo entorno para Playwright y Selenium: la base, el backend compilado en una copia y la página compilada.
      # Queda encendido hasta que termina el job, y el runner se borra con él.
      - name: Encender el entorno aislado
        run: |
          nohup npm run e2e:entorno > "$RUNNER_TEMP/entorno.log" 2>&1 &
          proceso=$!
          for intento in $(seq 1 120); do
            if grep -q 'Entorno listo en' "$RUNNER_TEMP/entorno.log"; then
              break
            fi
            if ! kill -0 "$proceso" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/entorno.log"
          direccion=$(grep -o 'Entorno listo en http://localhost:[0-9]*' "$RUNNER_TEMP/entorno.log" | sed 's/Entorno listo en //')
          if [ -z "$direccion" ]; then
            echo "::error::El entorno aislado no encendió. Su registro está arriba y en los reportes."
            exit 1
          fi
          echo "INSPECTIA_E2E_URL=$direccion" >> "$GITHUB_ENV"
      - name: Playwright, con Firefox
        run: npx playwright test
      # Sin Edge: en Ubuntu 24.04, AppArmor no deja que un navegador sin perfil propio cree los espacios de nombres de
      # su sandbox, y Edge se cierra al abrir («Chrome instance exited»). Edge se sigue probando en Windows.
      - name: Selenium, con Chrome
        if: ${{ !cancelled() && env.INSPECTIA_E2E_URL != '' }}
        env:
          INSPECTIA_E2E_SIN_EDGE: '1'
        run: npm run e2e:selenium
      - name: Reportes, si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-punta-a-punta
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/reports/selenium/
            frontend/e2e/.entorno/*.log
            ${{ runner.temp }}/entorno.log
          retention-days: 7
          if-no-files-found: ignore

  despliegue:
    name: Despliegue en AWS
    # Solo si todo lo demás pasó, en main (con un push o a mano) y con las variables de AWS del repositorio: mientras
    # falten, el job se salta y la CI sigue en verde (ver infra/README.md).
    needs: [generador, backend, frontend, infra, imagenes, punta-a-punta]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.AWS_CUENTA != '' && vars.AWS_ROL_GITHUB != '' && vars.CLOUDFRONT_DISTRIBUCION != ''
      && vars.EC2_INSTANCIA != '' && vars.INSPECTIA_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Un despliegue a la vez y en orden: el siguiente espera al que está corriendo, no lo corta a mitad.
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_CUENTA: ${{ vars.AWS_CUENTA }}
      CLOUDFRONT_DISTRIBUCION: ${{ vars.CLOUDFRONT_DISTRIBUCION }}
      EC2_INSTANCIA: ${{ vars.EC2_INSTANCIA }}
      INSPECTIA_URL: ${{ vars.INSPECTIA_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar la página
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Credenciales de AWS (OIDC, sin claves)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROL_GITHUB }}
          aws-region: us-east-1
      # Primero el servidor: si la versión nueva no queda sana, actualizar.sh vuelve sola a la anterior, el job falla y la
      # página nueva no se publica. Si la anterior tampoco arranca (por ejemplo, tras una migración), el registro lo dice.
      - name: Actualizar la instancia por SSM
        run: bash infra/aws/actualizar-instancia.sh "$EC2_INSTANCIA" "$GITHUB_SHA"
      # Los archivos de assets/ llevan su hash en el nombre: caché de un año. Los viejos se dejan, por si una pestaña
      # abierta con la versión anterior todavía los pide. index.html va al final y sin caché.
      - name: Publicar la página en S3
        run: |
          bucket="s3://inspectia-web-$AWS_CUENTA"
          aws s3 sync frontend/dist/assets "$bucket/assets" --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync frontend/dist "$bucket" --only-show-errors --delete \
            --exclude 'assets/*' --exclude index.html \
            --cache-control 'public, max-age=31536000'
          aws s3 cp frontend/dist/index.html "$bucket/index.html" --only-show-errors \
            --cache-control 'no-cache' --content-type 'text/html; charset=utf-8'
      - name: Invalidar CloudFront
        run: |
          invalidacion=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUCION" \
            --paths '/*' --query Invalidation.Id --output text)
          echo "Invalidación $invalidacion"
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUCION" --id "$invalidacion"
      # Prueba de humo por CloudFront: la página, una ruta de React (la CloudFront Function) y la API (401 sin sesión).
      - name: Comprobar el sitio
        run: |
          url="${INSPECTIA_URL%/}"
          revisar() {
            local ruta=$1 esperado=$2 codigo=''
            for _ in 1 2 3 4 5 6; do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' "$url$ruta" || true)
              if [ "$codigo" = "$esperado" ]; then
                echo "$ruta: $codigo"
                return 0
              fi
              sleep 10
            done
            echo "::error::$url$ruta respondió $codigo y se esperaba $esperado."
            return 1
          }
          revisar / 200
          revisar /lotes/1 200
          revisar /api/v1/sesion 401
          curl -fsS -o "$RUNNER_TEMP/ruta.html" "$url/lotes/1"
          grep -q '<div id="app">' "$RUNNER_TEMP/ruta.html" \
            || { echo '::error::Una ruta de React no devolvió index.html.'; exit 1; }

  aviso:
    name: Aviso de fallas
    needs: [generador, backend, frontend, infra, imagenes, punta-a-punta, despliegue]
    # Solo en main, también cuando algo falló; no si alguien canceló la corrida.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    # Todo lo que viene del push, como el mensaje del commit, entra por variables de entorno y nunca dentro del script.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTADOS: ${{ toJSON(needs) }}
      RAMA: ${{ github.ref_name }}
      CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT: ${{ github.sha }}
      MENSAJE: ${{ github.event.head_commit.message }}
      AUTOR: ${{ github.actor }}
    steps:
      - name: Abrir, comentar o cerrar el issue de cada job
        run: |
          # Cada job, con el nombre que se ve en GitHub. Hay un issue por job: así una falla repetida es la misma.
          declare -A NOMBRES=([generador]='Generador' [backend]='Backend' [frontend]='Frontend'
            [infra]='Infraestructura' [imagenes]='Imágenes Docker' [punta-a-punta]='De punta a punta'
            [despliegue]='Despliegue en AWS')
          commit="${COMMIT:0:7} «${MENSAJE%%$'\n'*}»"
          gh label create ci --color B60205 --description 'Falla de la integración continua' --force
          for job in generador backend frontend infra imagenes punta-a-punta despliegue; do
            resultado=$(jq -r --arg job "$job" '.[$job].result' <<< "$RESULTADOS")
            titulo="La CI falla en $RAMA: ${NOMBRES[$job]}"
            abierto=$(gh issue list --state open --label ci --limit 100 --json number,title \
              | jq -r --arg titulo "$titulo" '[.[] | select(.title == $titulo) | .number][0] // empty')
            case "$resultado" in
              # Un job que pasa de su tiempo máximo queda como cancelado: también es una falla.
              failure|cancelled)
                if [ -n "$abierto" ]; then
                  gh issue comment "$abierto" --body "Volvió a fallar en $CORRIDA, con el commit $commit, de @$AUTOR."
                  echo "${NOMBRES[$job]}: comentado en el issue #$abierto."
                else
                  cuerpo=$(printf '%s\n' \
                    "El job «${NOMBRES[$job]}» falló en \`$RAMA\`." \
                    '' \
                    "- Corrida: $CORRIDA" \
                    "- Commit: $commit" \
                    "- Push: @$AUTOR" \
                    '' \
                    "Si vuelve a fallar, la CI comenta aquí. Cuando vuelva a pasar en \`$RAMA\`, cierra este issue.")
                  # Si no se puede asignar a quien hizo el push, como un bot, el issue se abre igual, sin asignar.
                  gh issue create --title "$titulo" --label ci --assignee "$AUTOR" --body "$cuerpo" \
                    || gh issue create --title "$titulo" --label ci --body "$cuerpo"
                  echo "${NOMBRES[$job]}: issue abierto."
                fi
                ;;
              success)
                if [ -n "$abierto" ]; then
                  gh issue close "$abierto" --comment "Volvió a pasar en $CORRIDA, con el commit $commit."
                  echo "${NOMBRES[$job]}: issue #$abierto cerrado."
                fi
                ;;
              # skipped: el job no corrió, porque falló uno anterior (o, el despliegue, porque faltan las variables
              # de AWS o es un PR); su issue queda como estaba.
            esac
          done
