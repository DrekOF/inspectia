# Nombre: pytest.ini
# Descripción: Configuración de las pruebas del servicio de IA (pytest), con la marca de cada caso (RP-13).
# Fecha de creación: 24/11/2026
# Actualización: 24/11/2026
# Autor: Equipo InspectIA
# Versión: 1.0

[pytest]
testpaths = pruebas
pythonpath = . pruebas
addopts = --strict-markers
markers =
    caso(texto): ficha o requisito que cubre la prueba, como «RF-07 · C1 · ...» o «D-40 · ...» (RP-13)
