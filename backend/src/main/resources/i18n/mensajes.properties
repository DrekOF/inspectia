# Nombre: mensajes.properties
# Descripción: Mensajes de la API en español, el idioma por defecto (RP-11): los generales, que escribe a
#              mano el módulo comun, y los de las reglas escritas a mano de otros módulos, como los lotes.
#              Los de cada CRUD los genera generador/ en i18n/generado.properties.
# Fecha de creación: 13/10/2026
# Actualización: 24/11/2026
# Autor: Equipo InspectIA
# Versión: 1.9

error.no_autenticado=Inicia sesión para continuar.
error.prohibido=No tienes permiso para esta operación.
error.no_encontrado=No existe un registro con ese identificador.
error.datos_invalidos=Revisa los datos marcados.
error.dato_repetido=Ya existe un registro con esos datos.
error.cuerpo_invalido=La petición no trae un JSON válido.
error.valor_invalido=El valor no es válido.
error.interno=Ocurrió un error inesperado. Intenta de nuevo más tarde.

# Inicio de sesión (RF-01, D-28). La ayuda recibe los intentos permitidos y los minutos del bloqueo.
error.credenciales_incorrectas=Correo o contraseña incorrectos
error.ayuda_bloqueo=Si fallas {0} veces seguidas, la cuenta se bloquea {1} minutos.
error.usuario_desactivado=Tu usuario está desactivado: pide al administrador de tu empresa que lo reactive.
error.empresa_desactivada=Tu empresa está desactivada: comunícate con el equipo de InspectIA.
error.sesion_invalida=La sesión no es válida: inicia sesión de nuevo.
error.sesion_vencida=Tu sesión venció: inicia sesión de nuevo.
# Una sesión abierta antes de cambiar o restablecer la contraseña (RNF-04 C6, D-30).
error.contrasena_cambiada=Tu contraseña cambió: inicia sesión de nuevo.

# Cambiar la propia contraseña (RF-18).
error.contrasena_actual_incorrecta=La contraseña actual no es correcta.
error.cuenta_bloqueada=Tu cuenta está bloqueada por intentos fallidos: podrás cambiar la contraseña cuando termine el bloqueo.

# La fecha de recepción de un lote (RF-04, restricción 4). La de «posterior a hoy» sale de lote.json.
lote.fecha_recepcion.no_anterior_a_un_anio=La fecha de recepción no puede ser de hace más de un año.

# Los filtros del historial (RF-14 C2, restricción 5). Los nombres de los campos son los de la página.
lote.filtro.hasta_antes_de_desde=La fecha «Hasta» no puede ser anterior a «Resultado desde».

# Las fotos de la muestra (RF-05, D-41). Dicen qué pasó y qué hacer (RNF-06 C3); las de foto.json solo dicen
# qué pasó, y cambiarlas cambiaría V1 (P-16).
foto.formato.no_permitido=La foto debe ser JPG o PNG: elige una foto en uno de esos formatos.
foto.tamano_bytes.demasiado_grande=La foto pesa más de 10 MB: tómala de nuevo con la resolución normal de la cámara o elige otra.
foto.no_llego=La foto no llegó completa: súbela de nuevo.
foto.lote_no_pendiente=Este lote ya no está pendiente de análisis: sus fotos no se pueden cambiar.
foto.ya_subida=Ese enlace ya se usó: pide uno nuevo para subir otra foto.
# La página esperaba otra muestra: el lote cambió mientras estaba abierta (D-25).
foto.muestra_cambio=El lote cambió mientras tenías abierta esta página: recárgala para ver qué muestra recibe las fotos.
error.enlace_no_valido=El enlace de la foto venció o no es válido: vuelve a intentarlo.

# El análisis de la muestra (RF-05 C2, RF-10). Dicen qué pasó y qué hacer (RNF-06 C3).
analisis.fotos.minimo=Sube al menos 2 fotos para analizar la muestra.
analisis.lote_analizado=Este lote ya tiene su resultado: no se puede volver a analizar.
# Una foto «Por repetir» no se analiza: primero hay que tomarla de nuevo (RF-06, RF-07, RF-09).
analisis.fotos.por_repetir=Repite las fotos marcadas «Por repetir» antes de analizar la muestra.
# Un lote analizado sin sugerencia, o con sus 2 muestras, no recibe fotos de otra muestra (RF-12 C8, D-25).
analisis.sin_otra_muestra=Este lote ya tiene su resultado y no admite otra muestra: solo se analiza otra cuando el resultado la sugiere, y como máximo 2.
