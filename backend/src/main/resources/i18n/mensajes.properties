# Autor: Equipo InspectIA
# Versión: 1.4

error.no_autenticado=Inicia sesión para continuar.
error.prohibido=No tienes permiso para esta operación.
error.no_encontrado=No existe un registro con ese identificador.
error.datos_invalidos=Revisa los datos marcados.
error.dato_repetido=Ya existe un registro con esos datos.
error.cuerpo_invalido=La petición no trae un JSON válido.
error.valor_invalido=El valor no es válido.
error.interno=Ocurrió un error inesperado. Intenta de nuevo más tarde.

# Inicio de sesión (RF-01, D-28). La ayuda recibe los intentos permitidos y los minutos del bloqueo.
error.credenciales_incorrectas=Correo o contraseña incorrectos
error.ayuda_bloqueo=Si fallas {0} veces seguidas, la cuenta se bloquea {1} minutos.
error.usuario_desactivado=Tu usuario está desactivado: pide al administrador de tu empresa que lo reactive.
error.empresa_desactivada=Tu empresa está desactivada: comunícate con el equipo de InspectIA.
error.sesion_invalida=La sesión no es válida: inicia sesión de nuevo.
error.sesion_vencida=Tu sesión venció: inicia sesión de nuevo.
# Una sesión abierta antes de cambiar o restablecer la contraseña (RNF-04 C6, D-30).
error.contrasena_cambiada=Tu contraseña cambió: inicia sesión de nuevo.

# Cambiar la propia contraseña (RF-18).
error.contrasena_actual_incorrecta=La contraseña actual no es correcta.
error.cuenta_bloqueada=Tu cuenta está bloqueada por intentos fallidos: podrás cambiar la contraseña cuando termine el bloqueo.
