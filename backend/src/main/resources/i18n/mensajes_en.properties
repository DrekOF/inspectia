# Nombre: mensajes_en.properties
# Descripción: Mensajes de la API en inglés (RP-11): los generales, que escribe a mano el módulo comun, y
#              los de las reglas escritas a mano de otros módulos, como los lotes. Los de cada CRUD los genera
#              generador/ en i18n/generado_en.properties.
# Fecha de creación: 13/10/2026
# Actualización: 24/11/2026
# Autor: Equipo InspectIA
# Versión: 1.9

error.no_autenticado=Sign in to continue.
error.prohibido=You do not have permission for this operation.
error.no_encontrado=There is no record with that identifier.
error.datos_invalidos=Check the highlighted fields.
error.dato_repetido=A record with that data already exists.
error.cuerpo_invalido=The request does not contain valid JSON.
error.valor_invalido=The value is not valid.
error.interno=An unexpected error occurred. Try again later.

# Sign-in (RF-01, D-28). The help text receives the allowed attempts and the lockout minutes.
error.credenciales_incorrectas=Incorrect email or password
error.ayuda_bloqueo=If you fail {0} times in a row, the account is locked for {1} minutes.
error.usuario_desactivado=Your user is deactivated: ask your company administrator to reactivate it.
error.empresa_desactivada=Your company is deactivated: contact the InspectIA team.
error.sesion_invalida=The session is not valid: sign in again.
error.sesion_vencida=Your session expired: sign in again.
# A session opened before the password was changed or reset (RNF-04 C6, D-30).
error.contrasena_cambiada=Your password changed: sign in again.

# Changing your own password (RF-18).
error.contrasena_actual_incorrecta=The current password is not correct.
error.cuenta_bloqueada=Your account is locked after failed attempts: you can change the password when the lock ends.

# The reception date of a lot (RF-04, restriction 4). The «later than today» one comes from lote.json.
lote.fecha_recepcion.no_anterior_a_un_anio=The reception date cannot be more than a year ago.

# The history filters (RF-14 C2, restriction 5). The field names are the ones on the page.
lote.filtro.hasta_antes_de_desde=The «To» date cannot be before «Result from».

# The sample photos (RF-05, D-41). They say what happened and what to do (RNF-06 C3); the ones in foto.json
# only say what happened, and changing them would change V1 (P-16).
foto.formato.no_permitido=The photo must be JPG or PNG: choose a photo in one of those formats.
foto.tamano_bytes.demasiado_grande=The photo is larger than 10 MB: take it again with the camera's normal resolution or choose another one.
foto.no_llego=The photo did not arrive complete: upload it again.
foto.lote_no_pendiente=This lot is no longer pending analysis: its photos cannot be changed.
foto.ya_subida=That link was already used: ask for a new one to upload another photo.
# The page expected another sample: the lot changed while it was open (D-25).
foto.muestra_cambio=The lot changed while this page was open: reload it to see which sample takes the photos.
error.enlace_no_valido=The photo link expired or is not valid: try again.

# The sample analysis (RF-05 C2, RF-10). They say what happened and what to do (RNF-06 C3).
analisis.fotos.minimo=Upload at least 2 photos to analyze the sample.
analisis.lote_analizado=This lot already has its result: it cannot be analyzed again.
# An analyzed lot without the suggestion, or with its 2 samples, does not take photos for another sample
# (RF-12 C8, D-25).
analisis.sin_otra_muestra=This lot already has its result and does not accept another sample: another one is analyzed only when the result suggests it, and at most 2.

