# Sign-in (RF-01, D-28). The help text receives the allowed attempts and the lockout minutes.
error.credenciales_incorrectas=Incorrect email or password
error.ayuda_bloqueo=If you fail {0} times in a row, the account is locked for {1} minutes.
error.usuario_desactivado=Your user is deactivated: ask your company administrator to reactivate it.
error.empresa_desactivada=Your company is deactivated: contact the InspectIA team.
error.sesion_invalida=The session is not valid: sign in again.
error.sesion_vencida=Your session expired: sign in again.
# A session opened before the password was changed or reset (RNF-04 C6, D-30).
error.contrasena_cambiada=Your password changed: sign in again.

# Changing your own password (RF-18).
error.contrasena_actual_incorrecta=The current password is not correct.
error.cuenta_bloqueada=Your account is locked after failed attempts: you can change the password when the lock ends.

