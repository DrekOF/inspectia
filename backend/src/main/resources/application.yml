# Nombre: application.yml
# Descripción: Configuración del servidor de InspectIA. La conexión a la base sale de variables
#              de entorno; en local se leen de infra/.env, que no se sube al repositorio.
# Fecha de creación: 13/10/2026
# Actualización: 24/11/2026
# Autor: Equipo InspectIA
# Versión: 1.5

spring:
  application:
    name: inspectia-backend
  config:
    # infra/.env tiene el formato de un archivo .properties. Se busca desde backend/ y desde la raíz.
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:./infra/.env[.properties]
  datasource:
    # El puerto no tiene valor por defecto: cambia en cada equipo (ver CLAUDE.md).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Las tablas las crea Flyway desde las migraciones generadas; Hibernate solo valida el mapeo.
      ddl-auto: validate
    properties:
      hibernate:
        # Los granos de una muestra (de 100 a 450) se insertan en lotes, no de a uno (RNF-01).
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    locations: classpath:db/migration
  messages:
    # Mensajes del módulo comun (a mano) y de los CRUD (generados). Sin traducción, quedan en español.
    basename: i18n/mensajes,i18n/generado
    fallback-to-system-locale: false
  web:
    # Idioma de la respuesta si la petición no trae Accept-Language (RP-11).
    locale: es
  autoconfigure:
    # Sin el usuario de prueba en memoria de Spring Boot: los usuarios están en la base (RF-01).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

inspectia:
  jwt:
    # Clave HS256 de los tokens del inicio de sesión, en Base64 y de al menos 32 bytes (D-28). Sale
    # de la variable de entorno INSPECTIA_JWT_CLAVE (en local, de infra/.env) y nunca se escribe
    # aquí. Sin ella, el servidor no arranca.
    clave: ${INSPECTIA_JWT_CLAVE:}
  archivos:
    # Dónde van las fotos y los reportes (D-41, D-16). Sin decir el almacén, en una carpeta del servidor: es el de
    # desarrollo y de las pruebas (almacen: carpeta). En AWS, INSPECTIA_ARCHIVOS_ALMACEN=s3 (el perfil produccion no
    # arranca sin él): entonces no se cargan la carpeta ni sus enlaces firmados. El almacén no se escribe aquí.
    # La carpeta sale de INSPECTIA_FOTOS_CARPETA (en local, de infra/.env). Sin ella, o vacía, es
    # <carpeta del usuario>/.inspectia/fotos. Va completa y fuera del repositorio; las pruebas usan una temporal.
    carpeta: ${INSPECTIA_FOTOS_CARPETA:}
    # Con S3: el bucket (inspectia-archivos-<cuenta>) y su región (us-east-1). Las credenciales son las del rol de la
    # instancia, nunca claves en un archivo.
    bucket: ${INSPECTIA_ARCHIVOS_BUCKET:}
    region: ${AWS_REGION:}
  analisis:
    # Parámetros del análisis, que fija el equipo y no la empresa (RF-09). Se validan al arrancar: con uno que falta o
    # que no sirve, el servidor no arranca. Cada muestra copia el umbral y el máximo de dudosos que usó.
    umbral-confianza-baja: 60      # P-15, provisional: un grano con confianza menor que 60,00 es dudoso
    porcentaje-max-dudosos: 10     # RF-09: con más del 10 % de dudosos se pide repetir una foto (PR 4)
    factor-del-margen: 1           # P-19, provisional: el k del margen del porcentaje corregido
    puntos-para-otra-muestra: 1    # D-24: se sugiere otra muestra a menos de 1 punto de un límite
    cola:
      # Un hilo del servidor atiende la cola en el orden de envío (RNF-02 C3). Las pruebas de integración la
      # apagan (false) y la atienden a mano.
      automatica: true
      # Sin aviso, el hilo revisa la tabla cada 5 s.
      espera-maxima: 5s
  ia:
    # El clasificador de granos. Por ahora solo hay uno, el falso, que no da resultados reales: el PR 4 trae el
    # servicio de IA, y el PR del despliegue exigirá un valor explícito en AWS.
    clasificador: falso
    falso:
      # Cuánto espera el clasificador falso antes de responder, para ver el indicador de avance en desarrollo
      # (RNF-01 C4). Sale de INSPECTIA_IA_FALSO_DEMORA (en local, de infra/.env), por ejemplo 3s; sin ella, 0s.
      demora: ${INSPECTIA_IA_FALSO_DEMORA:0s}
